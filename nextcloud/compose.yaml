services:
  next-db:
    image: mariadb:10.6
    container_name: nextcloud_db_container
    restart: always
    networks:
      - nc-internal
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - ${DB_DATA_PATH:-../dbData}:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  next-app:
    image: nextcloud:33
    container_name: nextcloud_app_container
    restart: always
    networks:
      - nc-internal
      - traefik-proxy
    depends_on:
      next-db:
        condition: service_healthy
    volumes:
      - ${APP_DATA_PATH:-../appData}:/var/www/html
      - ${USER_DATA_PATH:-../userData}:/var/www/html/data
    environment:
      - MYSQL_HOST=next-db
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NC_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NC_ADMIN_PASSWORD}
      - TZ=${TIMEZONE}
      - PHP_MEMORY_LIMIT=${MEMORY_LIMIT}
      - PHP_UPLOAD_LIMIT=${UPLOAD_LIMIT}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
      - VIRTUAL_HOST=${DOMAIN}
      - LETSENCRYPT_HOST=${DOMAIN}
      - OVERWRITEHOST=${DOMAIN}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.cloud-xxx-redirect-web-secure.redirectscheme.scheme=https"
      - "traefik.http.routers.cloud-xxx-app-80.middlewares=cloud-xxx-redirect-web-secure"
      - "traefik.http.routers.cloud-xxx-app-80.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.cloud-xxx-app-80.entrypoints=web"
      - "traefik.http.routers.cloud-xxx-app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.cloud-xxx-app.entrypoints=websecure"
      - "traefik.http.routers.cloud-xxx-app.tls=true"
      - "traefik.http.routers.cloud-xxx-app.tls.domains[0].main=${DOMAIN}"
      - "traefik.http.routers.cloud-xxx-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cloud-xxx-app.middlewares=redirect-http-www@file,redirect-https-www@file,nextcloud_redirectregex"
      - "traefik.http.services.cloud-xxx-app.loadbalancer.server.port=80"
      - "traefik.http.middlewares.nextcloud_redirectregex.redirectregex.permanent=true"
      - "traefik.http.middlewares.nextcloud_redirectregex.redirectregex.regex=https://(.*)/.well-known/(?:card|cal)dav"
      # Note: The double '$$' escapes the variable so Traefik reads it, not Docker Compose
      - "traefik.http.middlewares.nextcloud_redirectregex.redirectregex.replacement=https://$${1}/remote.php/dav"
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT}
          cpus: '0.50'

networks:
  nc-internal:
    driver: bridge
  traefik-proxy:
    external: true
    name: traefik
